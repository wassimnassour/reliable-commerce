commerce:
  messaging:
    exchanges:
      - key: orders-dead-letter
        name: orders.dlx
        type: direct
        subscriptions:
            - key: fulfillment-orders-dlq
              queue: fulfillment.orders.dlq
              routing-keys:
                - fulfillment.orders.dead
      - key: orders
        name: commerce.events
        type: topic
        subscriptions:
          - key: fulfillment-orders
            queue: fulfillment.orders
            routing-keys:
              - order.created
              - order.cancelled
            arguments:
              x-dead-letter-exchange: orders.dlx
              x-dead-letter-routing-key: fulfillment.orders.dead
          - key: notifications-orders
            queue: notifications.orders
            routing-keys:
              - order.created
              - order.shipped

          - key: analytics-orders
            queue: analytics.orders
            routing-keys:
              - order.*

      - key: payments
        name: payment.events
        type: topic
        subscriptions:
          - key: fulfillment-payments
            queue: fulfillment.payments
            routing-keys:
              - payment.completed
