databaseChangeLog:
  - changeSet:
      id: 027-create-inventory-reservations
      author: wassim
      dbms: postgresql
      changes:
        - sql:
            sql: |
              CREATE TABLE inventory_reservations (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  order_id bigint NOT NULL REFERENCES orders(id) ON DELETE RESTRICT,
                  product_id bigint NOT NULL REFERENCES products(id) ON DELETE RESTRICT,
                  quantity integer NOT NULL CHECK (quantity > 0),
                  status varchar(255) NOT NULL CHECK (status IN ('RESERVED', 'CONFIRMED', 'RELEASED', 'EXPIRED')),
                  expires_at timestamp with time zone NOT NULL
              );
              CREATE INDEX idx_inventory_reservations_order_id ON inventory_reservations (order_id);
              CREATE INDEX idx_inventory_reservations_product_id ON inventory_reservations (product_id);
              CREATE INDEX idx_inventory_reservations_expiry ON inventory_reservations (status, expires_at);
      rollback:
        - dropTable:
            tableName: inventory_reservations
