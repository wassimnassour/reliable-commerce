databaseChangeLog:
  - changeSet:
      id: 028-move-stock-to-inventory
      author: wassim
      dbms: postgresql
      changes:
        - sql:
            sql: |
              CREATE TABLE inventory (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  product_id bigint NOT NULL UNIQUE REFERENCES products(id) ON DELETE CASCADE,
                  quantity integer NOT NULL CHECK (quantity >= 0),
                  version bigint NOT NULL DEFAULT 0
              );
              INSERT INTO inventory (product_id, quantity)
                  SELECT id, product_quantity FROM products;
              ALTER TABLE products DROP COLUMN product_quantity;
      rollback:
        - sql:
            sql: |
              ALTER TABLE products ADD COLUMN product_quantity integer NOT NULL DEFAULT 0 CHECK (product_quantity >= 0);
              UPDATE products p SET product_quantity = i.quantity FROM inventory i WHERE i.product_id = p.id;
              DROP TABLE inventory;
