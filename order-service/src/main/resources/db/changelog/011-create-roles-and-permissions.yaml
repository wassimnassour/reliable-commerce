databaseChangeLog:
  - changeSet:
      id: 011-create-roles-and-permissions
      author: wassim
      dbms: postgresql
      changes:
        - sql:
            sql: |
              CREATE TABLE roles (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  name varchar(255)
              );

              CREATE TABLE permission (
                  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  name varchar(255)
              );

              CREATE TABLE user_roles (
                  user_id bigint NOT NULL,
                  permission_id bigint NOT NULL,
                  CONSTRAINT pk_user_roles PRIMARY KEY (user_id, permission_id),
                  CONSTRAINT fk_user_roles_user FOREIGN KEY (user_id) REFERENCES users (id),
                  CONSTRAINT fk_user_roles_role FOREIGN KEY (permission_id) REFERENCES roles (id)
              );
              CREATE INDEX idx_user_roles_role ON user_roles (permission_id);

              CREATE TABLE roles_permission (
                  role_id bigint NOT NULL,
                  permission_id bigint NOT NULL,
                  CONSTRAINT pk_roles_permission PRIMARY KEY (role_id, permission_id),
                  CONSTRAINT fk_roles_permission_role FOREIGN KEY (role_id) REFERENCES roles (id),
                  CONSTRAINT fk_roles_permission_permission FOREIGN KEY (permission_id) REFERENCES permission (id)
              );
              CREATE INDEX idx_roles_permission_permission ON roles_permission (permission_id);
      rollback:
        - dropTable:
            tableName: roles_permission
        - dropTable:
            tableName: user_roles
        - dropTable:
            tableName: permission
        - dropTable:
            tableName: roles
