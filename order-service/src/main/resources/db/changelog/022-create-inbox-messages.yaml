databaseChangeLog:
  - changeSet:
      id: 022-create-inbox-messages
      author: wassim
      dbms: postgresql
      changes:
        - createTable:
            tableName: inbox_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_inbox_messages
                    nullable: false

              - column:
                  name: message_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: consumer_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PROCESSED
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: inbox_messages
            columnNames: message_id, consumer_name
            constraintName: uq_inbox_messages_message_consumer

        - createIndex:
            tableName: inbox_messages
            indexName: idx_inbox_messages_processed_at
            columns:
              - column:
                  name: processed_at

        - createIndex:
            tableName: inbox_messages
            indexName: idx_inbox_messages_status
            columns:
              - column:
                  name: status

      rollback:
        - dropTable:
            tableName: inbox_messages
