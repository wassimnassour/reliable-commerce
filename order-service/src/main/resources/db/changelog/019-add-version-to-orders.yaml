databaseChangeLog:
  - changeSet:
      id: 019-add-version-to-orders
      author: wassim
      dbms: postgresql
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: version
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: orders
            columnName: version
