databaseChangeLog:
  - changeSet:
      id: 031-payment-reconciliation-claims
      author: wassim
      changes:
        - addColumn:
            tableName: payments
            columns:
              - column:
                  name: reconciliation_claim_token
                  type: UUID
              - column:
                  name: reconciliation_claim_until
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: reconciliation_next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: "TIMESTAMPTZ '1970-01-01 00:00:00+00'"
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              CREATE INDEX idx_payments_reconciliation
              ON payments (reconciliation_next_attempt_at, id)
              WHERE status = 'PENDING'
