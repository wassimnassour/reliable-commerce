databaseChangeLog:
  - changeSet:
      author: wassimnassour
      id: 010-prepare-passwords-for-existing-users
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: users
                columnName: password
        - sqlCheck:
            expectedResult: "1"
            sql: SELECT CASE WHEN EXISTS (SELECT 1 FROM users) THEN 1 ELSE 0 END
      changes:
        # Existing accounts cannot log in until credentials are provisioned.
        # '!' is deliberately not a BCrypt hash or a shared usable password.
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password
                  type: varchar(255)
                  defaultValue: "!"
                  constraints:
                    nullable: false
        - dropDefaultValue:
            tableName: users
            columnName: password
            columnDataType: varchar(255)
  - changeSet:
      author: wassimnassour
      id: 010-add-password-column-to-users
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: users
                columnName: password
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
