databaseChangeLog:
  - changeSet:
      id: 013-create-refreshToken
      author: wassimnassour
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                  autoIncrement: true
              - column:
                  name: jti
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: sub
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: datetime
                  constraints:
                    nullable: false