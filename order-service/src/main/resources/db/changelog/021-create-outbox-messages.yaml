databaseChangeLog:
  - changeSet:
      id: 021-create-outbox-messages
      author: wassim
      dbms: postgresql
      changes:
        - createTable:
            tableName: outbox_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_messages
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: exchange
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: routing_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: retry_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: error_message
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE

        - createIndex:
            tableName: outbox_messages
            indexName: idx_outbox_messages_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at

        - createIndex:
            tableName: outbox_messages
            indexName: idx_outbox_messages_aggregate
            columns:
              - column:
                  name: aggregate_type
              - column:
                  name: aggregate_id

      rollback:
        - dropTable:
            tableName: outbox_messages
