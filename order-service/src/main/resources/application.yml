spring:
  config:
    import: classpath:rabbitMq/rabbitMqKeysConfig.yaml
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_password}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  scheduler:
    poolIntervalMs: 5000
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      accept-float-as-int: false
  web:
    error:
      include-stacktrace: never
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
    template:
       mandatory: true
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000     # 15 Minutes
  refresh-token-expiration-ms: 604800000  # 7 Days





